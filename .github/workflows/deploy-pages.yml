name: Deploy Print Kings to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://vmjapprncqkyabcabqfa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zRn3Pdp959A_ofsVdQGPJw_KkSoHIf9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html || cp dist/index.html dist/404.html
          grep -q "/printkings-website/" dist/index.html
          echo "Production artifact verified:"
          find dist -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment URL
        run: echo "GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"