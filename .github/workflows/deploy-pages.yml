name: Deploy Print Kings to GitHub Pages\n# Force deployment workflow to run for every main-branch storefront change

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://vmjapprncqkyabcabqfa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zRn3Pdp959A_ofsVdQGPJw_KkSoHIf9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for GitHub Pages branch deployment
        run: sleep 180
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
